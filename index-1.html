<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>YTube MA – يوتيوب المغرب</title>

  <!-- PWA Manifest inline -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c1001f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YTube MA" />
  <meta name="description" content="شاهد يوتيوب في المغرب – مجاناً" />

  <!-- Icons (base64 SVG placeholders; replace with real PNG icons for production) -->
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

    :root {
      --red:   #c1001f;
      --green: #006233;
      --dark:  #0a0a0a;
      --light: #f5f0eb;
      --gold:  #d4a843;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Cairo', sans-serif;
    }

    /* ─── SPLASH SCREEN ─────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0; z-index: 100;
      background: var(--dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      transition: opacity .5s ease, transform .5s ease;
    }
    #splash.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }

    .logo-wrap {
      position: relative;
      width: 110px; height: 110px;
    }
    .logo-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--red);
      border-right-color: var(--gold);
      animation: spin 1.4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-inner {
      position: absolute; inset: 10px;
      background: var(--red);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-inner svg { width: 52px; height: 52px; }

    .app-name {
      color: #fff;
      font-size: 28px; font-weight: 900;
      letter-spacing: 1px;
    }
    .app-name span { color: var(--red); }

    .tagline {
      color: rgba(255,255,255,.45);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .progress-bar {
      width: 160px; height: 3px;
      background: rgba(255,255,255,.1);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red), var(--gold));
      border-radius: 99px;
      animation: fill 1.8s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes fill { from { width: 0 } to { width: 100% } }

    .flag-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--red) 50%, var(--green) 50%);
    }

    /* ─── IFRAME LAYER ──────────────────────────────────────── */
    #yt-frame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      opacity: 0;
      transition: opacity .4s ease;
    }
    #yt-frame.visible { opacity: 1; }

    /* ─── FALLBACK (when iframe is blocked by browser) ──────── */
    #fallback {
      position: fixed; inset: 0;
      background: var(--dark);
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px; padding: 32px;
      text-align: center;
    }
    #fallback.show { display: flex; }

    .fb-icon { font-size: 64px; }

    .fb-title {
      color: #fff; font-size: 22px; font-weight: 700;
    }
    .fb-sub {
      color: rgba(255,255,255,.5); font-size: 14px; line-height: 1.6;
      max-width: 320px;
    }
    .open-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--red);
      color: #fff; font-family: 'Cairo', sans-serif;
      font-size: 16px; font-weight: 700;
      padding: 14px 32px; border-radius: 99px;
      border: none; cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 32px rgba(193,0,31,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .open-btn:active { transform: scale(.96); box-shadow: 0 4px 16px rgba(193,0,31,.3); }

    .pwa-hint {
      color: rgba(255,255,255,.3);
      font-size: 11px; margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- SPLASH -->
  <div id="splash">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-inner">
        <!-- YouTube play icon -->
        <svg viewBox="0 0 68 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M66.5 7.7c-.8-2.9-3-5.1-5.9-5.9C55.4 0 34 0 34 0S12.6 0 7.4 1.8C4.5 2.6 2.3 4.8 1.5 7.7 0 12.8 0 24 0 24s0 11.2 1.5 16.3c.8 2.9 3 5.1 5.9 5.9C12.6 48 34 48 34 48s21.4 0 26.6-1.8c2.9-.8 5.1-3 5.9-5.9C68 35.2 68 24 68 24s0-11.2-1.5-16.3z" fill="white"/>
          <path d="M27 34l18-10-18-10v20z" fill="#c1001f"/>
        </svg>
      </div>
    </div>

    <div class="app-name">YTube <span>MA</span></div>
    <div class="tagline">يوتيوب المغرب</div>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="flag-bar"></div>
  </div>

  <!-- YOUTUBE IFRAME -->
  <iframe
    id="yt-frame"
    src="https://www.youtube.com"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    allowfullscreen
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"
  ></iframe>

  <!-- FALLBACK for browsers that block the iframe -->
  <div id="fallback">
    <div class="fb-icon">📺</div>
    <div class="fb-title">افتح يوتيوب</div>
    <div class="fb-sub">
      المتصفح الخاص بك يمنع التضمين.<br/>
      في تطبيق الأندرويد يعمل بشكل كامل.
    </div>
    <a class="open-btn" href="https://www.youtube.com" target="_blank" rel="noopener">
      <svg width="20" height="14" viewBox="0 0 68 48" fill="none">
        <path d="M66.5 7.7c-.8-2.9-3-5.1-5.9-5.9C55.4 0 34 0 34 0S12.6 0 7.4 1.8C4.5 2.6 2.3 4.8 1.5 7.7 0 12.8 0 24 0 24s0 11.2 1.5 16.3c.8 2.9 3 5.1 5.9 5.9C12.6 48 34 48 34 48s21.4 0 26.6-1.8c2.9-.8 5.1-3 5.9-5.9C68 35.2 68 24 68 24s0-11.2-1.5-16.3z" fill="white"/>
        <path d="M27 34l18-10-18-10v20z" fill="#c1001f"/>
      </svg>
      افتح يوتيوب
    </a>
    <div class="pwa-hint">نصيحة: ثبّت التطبيق للحصول على تجربة كاملة</div>
  </div>

  <script>
    const splash   = document.getElementById('splash');
    const frame    = document.getElementById('yt-frame');
    const fallback = document.getElementById('fallback');

    // After the progress animation (~1.8 s), try to show the iframe
    setTimeout(() => {
      splash.classList.add('hidden');

      // Test if iframe loaded (works in WebView / some browsers)
      try {
        // In WebView this succeeds; in restrictive browsers it throws or stays empty
        frame.classList.add('visible');

        // After 3 s if the iframe content is still inaccessible, show fallback
        setTimeout(() => {
          try {
            // cross-origin access will throw → we're in a browser that blocked it
            const doc = frame.contentDocument || frame.contentWindow.document;
            if (!doc || doc.URL === 'about:blank' || doc.URL === '') {
              showFallback();
            }
          } catch (_) {
            // Expected in browsers; show fallback
            showFallback();
          }
        }, 3000);

      } catch (e) {
        showFallback();
      }
    }, 2000);

    function showFallback() {
      frame.style.display = 'none';
      fallback.classList.add('show');
    }

    // ── Service Worker registration (PWA offline shell) ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
